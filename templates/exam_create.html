{% extends 'base.html' %}{% block content %}<h2>Create Exam</h2><form method="post" class="card card-body gap-3"><div><label class="form-label">Exam Title</label><input name="title" class="form-control" required></div><div><label class="form-label">Subject</label><input name="subject" class="form-control" required></div><div><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div><div><label class="form-label">Duration (minutes)</label><input name="duration" type="number" min="1" max="360" value="30" class="form-control" required></div><div class="row"><div class="col-md-6"><label class="form-label">Start time (optional)</label><input name="start_at" type="datetime-local" class="form-control"></div><div class="col-md-6"><label class="form-label">End time (optional)</label><input name="end_at" type="datetime-local" class="form-control"></div></div><button class="btn btn-primary">Create & Add Questions</button></form>{% endblock %}
