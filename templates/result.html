{% extends 'base.html' %}{% block content %}<div class="card"><div class="card-body text-center py-5"><h2>Exam Result</h2><p class="text-muted">{{ sub.exam.title }} · {{ sub.exam.subject }}</p><div class="score-display">{{ sub.score }} / {{ sub.max_score }}</div><p>Submitted: {{ sub.submitted_at.strftime('%Y-%m-%d %H:%M UTC') }}</p><a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to Dashboard</a></div></div>{% endblock %}
