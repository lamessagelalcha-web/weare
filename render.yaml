services:
  - type: web
    name: oems-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: System Administrator
      - key: DATABASE_URL
        fromDatabase:
          name: oems-db
          property: connectionString

databases:
  - name: oems-db
    databaseName: oems
    user: oems_user
